<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrettyReMark</title>
<link rel="icon" href="favicon.ico">
<link id="theme-md" rel="stylesheet" href="github-markdown.css">
<link id="theme-hl" rel="stylesheet" href="highlight-github.min.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 0; background-color: #ffffff; transition: background-color 0.2s; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; overflow: hidden; }
body.dark { background-color: #0d1117; }

/* Layout */
#app { display: flex; height: 100vh; }

/* Drawer */
#drawer {
    width: var(--drawer-width, 240px); min-width: 0; height: 100%; overflow-y: auto; overflow-x: hidden;
    border-right: 1px solid #d1d9e0; background: #f6f8fa;
    transition: width 0.2s ease, opacity 0.2s ease;
    flex-shrink: 0;
}
/* Dragging sets this to suppress the transition above -- otherwise every mousemove's width
   change gets animated instead of applied instantly, and the drawer visibly lags the cursor. */
#drawer.no-transition { transition: none; }
#drawer.collapsed { width: 0; border-right: none; opacity: 0; pointer-events: none; }
body.dark #drawer { background: #161b22; border-right-color: #30363d; }

/* Drag handle between drawer and main content. A real flex sibling (not an absolutely
   positioned overlay on #drawer) so it never has to fight the drawer's own width/overflow
   rules, and disappears automatically -- via the adjacent-sibling selector below -- whenever
   #drawer is collapsed, with no extra JS to keep the two in sync. */
#drawer-resizer {
    width: 4px; flex-shrink: 0; cursor: col-resize; background: transparent;
}
#drawer-resizer:hover, #drawer-resizer.dragging { background: #0969da; }
body.dark #drawer-resizer:hover, body.dark #drawer-resizer.dragging { background: #4493f8; }
#drawer.collapsed + #drawer-resizer { display: none; }

#drawer-header {
    padding: 10px 12px; font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.5px; color: #656d76; border-bottom: 1px solid #d1d9e0;
    display: flex; align-items: center; justify-content: space-between;
}
body.dark #drawer-header { color: #8b949e; border-bottom-color: #30363d; }

#drawer-header button {
    background: none; border: none; cursor: pointer; font-size: 16px; color: #656d76;
    padding: 0 2px; line-height: 1;
}
body.dark #drawer-header button { color: #8b949e; }

#drawer-list { padding: 4px 0; }

.drawer-item {
    padding: 6px 8px 6px 12px; cursor: pointer; display: flex; align-items: center;
    border-left: 3px solid transparent; position: relative;
}
.drawer-item:hover { background: #e8ebef; }
body.dark .drawer-item:hover { background: #1c2129; }
.drawer-item.active { border-left-color: #0969da; background: #ddf4ff; }
body.dark .drawer-item.active { border-left-color: #4493f8; background: #1a2332; }

.drawer-info { overflow: hidden; flex: 1; min-width: 0; }
.drawer-filename {
    display: block; font-size: 13px; font-weight: 500; color: #1f2328;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
body.dark .drawer-filename { color: #f0f6fc; }
.drawer-path {
    display: block; font-size: 10px; color: #656d76; margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
body.dark .drawer-path { color: #8b949e; }

.drawer-close {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; line-height: 18px; text-align: center;
    font-size: 14px; color: #656d76; border-radius: 3px; cursor: pointer;
    opacity: 0; transition: opacity 0.1s;
}
.drawer-item:hover .drawer-close { opacity: 1; }
.drawer-close:hover { background: #d1d9e0; color: #1f2328; }
body.dark .drawer-close { color: #8b949e; }
body.dark .drawer-close:hover { background: #30363d; color: #f0f6fc; }

/* Main area */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; }

/* Tab bar */
#tab-bar {
    display: flex; align-items: center; height: 36px; min-height: 36px;
    background: #f6f8fa; border-bottom: 1px solid #d1d9e0;
    overflow-x: auto; overflow-y: hidden; flex-shrink: 0;
}
#tab-bar:empty { display: none; }
#tab-bar.tabbar-hidden { display: none; }
body.dark #tab-bar { background: #161b22; border-bottom-color: #30363d; }

/* Toggle button in tab bar */
#drawer-toggle {
    flex-shrink: 0; width: 36px; height: 36px; display: flex; align-items: center;
    justify-content: center; cursor: pointer; color: #656d76; font-size: 16px;
    border-right: 1px solid #d1d9e0; background: none; border-top: none; border-bottom: none; border-left: none;
}
#drawer-toggle:hover { background: #e8ebef; color: #1f2328; }
body.dark #drawer-toggle { color: #8b949e; border-right-color: #30363d; }
body.dark #drawer-toggle:hover { background: #1c2129; color: #f0f6fc; }

.tab {
    display: flex; align-items: center; gap: 6px; padding: 0 12px; height: 100%;
    font-size: 12px; color: #656d76; cursor: pointer; white-space: nowrap;
    border-right: 1px solid #d1d9e0; flex-shrink: 0; max-width: 200px;
}
.tab:hover { background: #e8ebef; }
body.dark .tab { color: #8b949e; border-right-color: #30363d; }
body.dark .tab:hover { background: #1c2129; }

.tab.active { color: #1f2328; background: #ffffff; font-weight: 500; }
body.dark .tab.active { color: #f0f6fc; background: #0d1117; }

.tab-name { overflow: hidden; text-overflow: ellipsis; }

.tab-close {
    font-size: 14px; line-height: 1; padding: 0 2px; border-radius: 3px;
    opacity: 0; transition: opacity 0.1s; flex-shrink: 0;
}
.tab:hover .tab-close { opacity: 1; }
.tab-close:hover { background: #d1d9e0; }
body.dark .tab-close:hover { background: #30363d; }

/* Content area */
/* overflow-anchor: none -- otherwise, if a tab's images finish loading (and growing) above the
   target scrollTop after it's been set, the browser's CSS scroll anchoring feature nudges
   scrollTop to compensate. Fine for a single slow image, but can overshoot significantly with
   several images loading in sequence right after a large programmatic scrollTop is set -- the
   exact situation a session restore full of long-untouched (uncached) tabs creates. Disabled so
   the target render() sets (see index.html's render()) stays put regardless of what loads in
   afterward. */
#content-area { flex: 1; overflow-y: auto; overflow-anchor: none; }
.markdown-body { padding: 32px 40px; }

/* Status bar */
#status-bar {
    display: flex; align-items: center; height: 26px; min-height: 26px;
    padding: 0 10px; font-size: 11px; color: #656d76;
    background: #f6f8fa; border-top: 1px solid #d1d9e0; flex-shrink: 0;
    gap: 10px;
}
body.dark #status-bar { background: #161b22; border-top-color: #30363d; color: #8b949e; }

#zoom-control { display: flex; align-items: center; gap: 6px; }
#zoom-slider {
    -webkit-appearance: none; appearance: none; width: 100px; height: 4px;
    background: #d1d9e0; border-radius: 2px; outline: none; cursor: pointer;
}
body.dark #zoom-slider { background: #30363d; }
#zoom-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 12px; height: 12px;
    background: #656d76; border-radius: 50%; cursor: pointer;
}
body.dark #zoom-slider::-webkit-slider-thumb { background: #8b949e; }
#zoom-label { min-width: 32px; text-align: center; }

#status-info { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

/* Find bar */
#find-bar {
    display: none; position: fixed; top: 8px; right: 8px; z-index: 1000;
    background: #fff; border: 1px solid #d0d7de; border-radius: 6px;
    padding: 4px 8px; box-shadow: 0 1px 3px rgba(0,0,0,.12);
    align-items: center; gap: 4px;
}
body.dark #find-bar { background: #161b22; border-color: #30363d; }
#find-input {
    border: 1px solid #d0d7de; border-radius: 4px; padding: 4px 8px;
    font-size: 13px; width: 200px; outline: none; background: #fff; color: #1f2328;
}
body.dark #find-input { background: #0d1117; border-color: #30363d; color: #e6edf3; }
#find-input:focus { border-color: #0969da; box-shadow: 0 0 0 2px rgba(9,105,218,.3); }
body.dark #find-input:focus { border-color: #4493f8; box-shadow: 0 0 0 2px rgba(68,147,248,.3); }
#find-bar button {
    background: none; border: 1px solid transparent; border-radius: 4px;
    cursor: pointer; padding: 2px 6px; color: #656d76; font-size: 14px;
}
#find-bar button:hover { background: #f3f4f6; border-color: #d0d7de; }
body.dark #find-bar button { color: #8b949e; }
body.dark #find-bar button:hover { background: #30363d; border-color: #484f58; }
#find-count { font-size: 11px; color: #656d76; min-width: 40px; text-align: center; }
body.dark #find-count { color: #8b949e; }
mark.find-match { background: #fff2b0; color: inherit; border-radius: 2px; }
body.dark mark.find-match { background: #6e5e14; }
mark.find-match.current { background: #f9826c; }
body.dark mark.find-match.current { background: #b35c44; }

/* Print */
@media print {
    #drawer, #tab-bar, #status-bar, #find-bar { display: none !important; }
    #app { display: block; }
    #main { display: block; height: auto; }
    #content-area { overflow: visible; height: auto; zoom: 1 !important; }
    body { overflow: visible; background: #fff !important; }
    body.dark { background: #fff !important; color: #1f2328 !important; }
    .markdown-body { padding: 0; max-width: none; }
}
</style>
</head>
<body>

<div id="app">
    <div id="drawer">
        <div id="drawer-header">
            <span>Open Files</span>
            <button onclick="toggleDrawer()" title="Close sidebar">&times;</button>
        </div>
        <div id="drawer-list"></div>
    </div>
    <div id="drawer-resizer" title="Drag to resize"></div>
    <div id="main">
        <div id="tab-bar">
            <button id="drawer-toggle" onclick="toggleDrawer()" title="Toggle sidebar">&#9776;</button>
        </div>
        <div id="content-area">
            <article class="markdown-body" id="content"></article>
        </div>
        <div id="status-bar">
            <div id="status-info"></div>
            <div id="zoom-control">
                <span style="cursor:pointer;" onclick="zoomOut()" title="Zoom out">&#x2212;</span>
                <input type="range" id="zoom-slider" min="50" max="200" value="100" step="10" oninput="setZoomFromSlider(this.value)">
                <span style="cursor:pointer;" onclick="zoomIn()" title="Zoom in">+</span>
                <span id="zoom-label">100%</span>
            </div>
        </div>
    </div>
</div>

<div id="find-bar">
    <input type="text" id="find-input" placeholder="Find...">
    <span id="find-count"></span>
    <button id="find-prev" title="Previous (Shift+Enter)">&#9650;</button>
    <button id="find-next" title="Next (Enter)">&#9660;</button>
    <button id="find-close" title="Close (Esc)">&times;</button>
</div>

<script src="marked.min.js"></script>
<script src="highlight.min.js"></script>
<script src="purify.min.js"></script>
<script>
// Disable highlight.js language auto-detection: an unlabeled ```-fenced block
// (no "language-xxx" class from marked) would otherwise be run through every
// bundled grammar and highlighted using whichever one scores best -- producing
// bogus "syntax highlighting" on plain text/prose. Blocks that DO specify a
// language are unaffected, since those skip auto-detection entirely and go
// straight to that named grammar.
hljs.configure({ languages: [] });

var _el = document.getElementById('content');
var _zoom = 1.0;
var _dark = false;
var _drawerOpen = true;
var _strings = {};
var _version = '';

marked.setOptions({ gfm: true, breaks: false });

function T(key) { return _strings[key] || key; }

function setStrings(obj) {
    _strings = obj;
    _applyStrings();
}

// Called once at startup from Program.cs (OnNavigationCompleted), mirroring setStrings() above.
function setAppVersion(v) {
    _version = v;
}

// User color overrides read from colors.json (see ColorConfig in Program.cs), sent once at
// startup. Stored here and (re)applied by setDarkMode() below, whichever theme is active.
var _colorOverrides = { Light: {}, Dark: {} };

function setColorOverrides(obj) {
    _colorOverrides = obj;
    _applyColorOverrides();
}

// Rebuilds the <style id="color-overrides"> block for whichever theme is currently active.
// Injected after the theme stylesheet in the cascade (see <head>), so it wins without
// touching github-markdown[-dark].css itself.
function _applyColorOverrides() {
    var theme = _dark ? _colorOverrides.Dark : _colorOverrides.Light;
    var el = document.getElementById('color-overrides');
    if (!el) {
        el = document.createElement('style');
        el.id = 'color-overrides';
        document.head.appendChild(el);
    }
    if (!theme) { el.textContent = ''; return; }

    // .markdown-body's base rule (in <head> above) is a single unscoped selector -- light/dark
    // is swapped by pointing #theme-md at a whole different stylesheet, not a body.dark class --
    // so an unscoped override here always outranks/out-orders it regardless of theme.
    //
    // The sidebar selectors below are different: their dark-mode colors come from "body.dark X"
    // rules living alongside the plain "X" light rules in that same <head> style block, and
    // "body.dark X" is MORE specific than a bare "X". So when dark mode is active, our override
    // has to be written as "body.dark X" too, or the base dark rule would win over it despite
    // this <style> block coming later in the document. `scope` below adds that prefix (as a
    // descendant selector -- these are all genuine descendants of body) only when it's needed.
    var scope = _dark ? 'body.dark ' : '';
    var rules = '';

    var docRules = '';
    if (theme.TextColor) docRules += 'color:' + theme.TextColor + ';';
    if (theme.BackgroundColor) docRules += 'background-color:' + theme.BackgroundColor + ';';
    if (docRules) rules += '.markdown-body{' + docRules + '}';

    if (theme.SidebarBackgroundColor) rules += scope + '#drawer{background:' + theme.SidebarBackgroundColor + ';}';
    if (theme.SidebarFilenameColor) rules += scope + '.drawer-filename{color:' + theme.SidebarFilenameColor + ';}';
    if (theme.SidebarPathColor) rules += scope + '.drawer-path{color:' + theme.SidebarPathColor + ';}';

    var activeRules = '';
    if (theme.SidebarActiveBackgroundColor) activeRules += 'background:' + theme.SidebarActiveBackgroundColor + ';';
    if (theme.SidebarActiveBarColor) activeRules += 'border-left-color:' + theme.SidebarActiveBarColor + ';';
    if (activeRules) rules += scope + '.drawer-item.active{' + activeRules + '}';

    if (theme.SidebarHoverBackgroundColor) rules += scope + '.drawer-item:hover{background:' + theme.SidebarHoverBackgroundColor + ';}';

    // Tab bar deliberately has no color fields of its own -- it's aliased onto the three
    // sidebar fields above (same scoping rules apply: dark-mode base rules for #tab-bar/.tab
    // also live under "body.dark X" in <head>, so they need the same "body.dark " prefix to
    // be out-specificity'd).
    if (theme.SidebarBackgroundColor) rules += scope + '#tab-bar{background:' + theme.SidebarBackgroundColor + ';}';
    if (theme.SidebarPathColor) rules += scope + '.tab{color:' + theme.SidebarPathColor + ';}';
    if (theme.SidebarFilenameColor) rules += scope + '.tab.active{color:' + theme.SidebarFilenameColor + ';}';

    el.textContent = rules;
}

function _applyStrings() {
    // Drawer header
    var dh = document.querySelector('#drawer-header span');
    if (dh) dh.textContent = T('drawer_header');
    var dhBtn = document.querySelector('#drawer-header button');
    if (dhBtn) dhBtn.title = T('tooltip_close_sidebar');

    // Toggle sidebar button
    var dt = document.getElementById('drawer-toggle');
    if (dt) dt.title = T('tooltip_toggle_sidebar');

    // Find bar
    var fi = document.getElementById('find-input');
    if (fi) fi.placeholder = T('find_placeholder');
    var fp = document.getElementById('find-prev');
    if (fp) fp.title = T('find_prev_tooltip');
    var fn = document.getElementById('find-next');
    if (fn) fn.title = T('find_next_tooltip');
    var fc = document.getElementById('find-close');
    if (fc) fc.title = T('find_close_tooltip');

    // Zoom tooltips
    var zOutSpan = document.querySelector('#zoom-control span[onclick="zoomOut()"]');
    if (zOutSpan) zOutSpan.title = T('tooltip_zoom_out');
    var zInSpan = document.querySelector('#zoom-control span[onclick="zoomIn()"]');
    if (zInSpan) zInSpan.title = T('tooltip_zoom_in');

    // Re-render welcome/about if visible. Checked via a stable id (welcome-screen) rather than
    // matching the h1's text against a hardcoded app name -- that broke the moment the app was
    // renamed (this exact rename), since T('app_name') had already changed by the time this ran
    // but the literal string here hadn't. An id has no name baked into it, so it can't drift out
    // of sync with the app's display name again.
    if (document.getElementById('welcome-screen')) {
        showWelcome();
    }
    var aboutEl = document.getElementById('app-about');
    if (aboutEl) { aboutEl.remove(); showAbout(); }
}

function setDarkMode(on) {
    _dark = on;
    document.body.classList.toggle('dark', on);
    document.getElementById('theme-md').href = on ? 'github-markdown-dark.css' : 'github-markdown.css';
    document.getElementById('theme-hl').href = on ? 'highlight-github-dark.min.css' : 'highlight-github.min.css';
    _applyColorOverrides();
}

function isDarkMode() { return _dark; }

var _purifyConfig = {
    ALLOWED_TAGS: ['h1','h2','h3','h4','h5','h6','blockquote','p','a','ul','ol',
                   'li','b','i','strong','em','del','code','hr','br','div',
                   'table','thead','tbody','tr','th','td','pre','span','img',
                   'input','sup','sub','dl','dt','dd','details','summary'],
    ALLOWED_ATTR: ['href','title','alt','src','class','id','type','checked','disabled'],
    ALLOW_DATA_ATTR: false,
    ALLOWED_URI_REGEXP: /^(?:(?:https?|mailto|tel):|[^a-z]|[a-z+.\-]+(?:[^a-z+.\-:]|$))/i
};

// restoreTabScroll (default true) restores the ACTIVE tab's remembered scroll position --
// captured in activateTab() above when the reader last switched away from it -- rather than
// jumping to the top. That's correct for opening a file or switching tabs. reloadContent()
// below passes false and does its own (live, not tab-map) scroll preservation instead, since
// a same-tab disk-reload isn't a tab switch -- activateTab() never ran, so there's no fresh
// tab-map entry to restore from.
function render(md, restoreTabScroll) {
    if (restoreTabScroll === undefined) restoreTabScroll = true;
    _el.style.cssText = '';
    _el.innerHTML = DOMPurify.sanitize(marked.parse(md), _purifyConfig);
    document.querySelectorAll('pre code').forEach(function(block) {
        hljs.highlightElement(block);
    });
    _resolveLocalImages();
    var contentArea = document.getElementById('content-area');
    var target = restoreTabScroll ? (_scrollPositions[_activeTabId] || 0) : 0;
    // Deferred a frame for the same reason as reloadContent() below: setting scrollTop
    // immediately after innerHTML is replaced gets ignored, since the browser hasn't finished
    // laying out the new content yet.
    requestAnimationFrame(function() {
        contentArea.scrollTop = target;
        // If the file got shorter since `target` was saved (edited externally, ads trimmed,
        // etc.), the browser clamps an out-of-range scrollTop down to the new max automatically
        // -- fine for right now, but if the corrected value is never saved back, the same stale
        // (too-large) target just gets reapplied and re-clamped every single time this tab is
        // opened, since nothing else would prompt a fresh save -- landing at the bottom looks
        // like "I'm at the end", so there's no obvious reason to scroll and overwrite it. Saving
        // the corrected value here, through the same path the debounced scroll listener uses,
        // makes this self-heal after one clamp instead of recurring indefinitely.
        if (contentArea.scrollTop !== target) _persistScrollPosition(_activeTabId, contentArea.scrollTop);
    });
}

// The file-watcher fires when the CURRENTLY DISPLAYED document changes on disk (e.g. trimming
// ads out of a saved chat export while it's open) -- a same-tab content refresh, not a tab
// switch, so it needs its own scroll handling rather than render()'s tab-scroll-map restore
// (which has nothing fresh to restore from here, since activateTab() never ran).
// Program.cs's file-watch handler calls this instead of render() for that specific case.
//
// We don't try to track *which* line the old scrollTop corresponded to in the new
// content — after a small edit the same pixel offset lands you close enough to where
// you were, which is all that's needed here.
//
// The restore is deferred to the next animation frame because setting scrollTop
// synchronously right after innerHTML is replaced gets ignored: the browser hasn't
// finished laying out the new content yet, so the scroll container's height (and thus
// its scrollable range) hasn't been updated.
function reloadContent(md) {
    var contentArea = document.getElementById('content-area');
    var savedScrollTop = contentArea.scrollTop;
    render(md, false);
    requestAnimationFrame(function() {
        contentArea.scrollTop = savedScrollTop;
        // Same self-heal as render() above -- an external edit that trims content is exactly
        // the case this function exists for, so a stale/clamped scrollTop is if anything more
        // likely here than on an ordinary tab switch.
        if (contentArea.scrollTop !== savedScrollTop) _persistScrollPosition(_activeTabId, contentArea.scrollTop);
    });
}

// Relative image paths get resolved by the browser against https://app.local/index.html
// (PrettyReMark's own UI origin) rather than the document's actual folder, causing a broken-image
// icon. Program.cs maps "doc.local" to the active tab's folder on every render, so point any
// relative/local src there instead. Same decode-then-encode-once normalization as local links,
// since marked.js has already percent-encoded these src values by the time we see them.
function _resolveLocalImages() {
    _el.querySelectorAll('img[src]').forEach(function(img) {
        var raw = img.getAttribute('src');
        if (!raw || /^(?:https?:|data:|https:\/\/doc\.local\/)/i.test(raw)) return;
        var relPath = raw;
        try { relPath = decodeURIComponent(raw); } catch (ex) { /* not valid percent-encoding — use as written */ }
        img.src = 'https://doc.local/' + encodeURI(relPath);
    });
}

function showWelcome() {
    _el.style.cssText = 'display:flex;justify-content:center;align-items:center;min-height:80vh;';
    _el.innerHTML =
        '<div id="welcome-screen" style="text-align:center;">' +
        '<h1 style="border:none;padding:0;">' + _esc(T('app_name')) + '</h1>' +
        '<p style="color:#656d76;font-size:18px;">' + _esc(T('welcome_subtitle')) + '</p>' +
        '<hr style="margin:24px auto;width:200px;">' +
        '<p>' + _esc(T('welcome_open_instruction')) + '</p>' +
        '<p style="color:#656d76;">' + _esc(T('welcome_drag_instruction')) + '</p>' +
        '</div>';
}

// --- Zoom ---
function _updateZoom() {
    document.getElementById('content-area').style.zoom = _zoom;
    document.getElementById('zoom-slider').value = Math.round(_zoom * 100);
    document.getElementById('zoom-label').textContent = Math.round(_zoom * 100) + '%';
}
function zoomIn() {
    _zoom = Math.min(Math.round((_zoom + 0.1) * 10) / 10, 2.0);
    _updateZoom();
}
function zoomOut() {
    _zoom = Math.max(Math.round((_zoom - 0.1) * 10) / 10, 0.5);
    _updateZoom();
}
function zoomReset() {
    _zoom = 1.0;
    _updateZoom();
}
function setZoomFromSlider(val) {
    _zoom = parseInt(val) / 100;
    _updateZoom();
}

// --- Drawer ---
function setDrawerOpen(open) {
    _drawerOpen = open;
    document.getElementById('drawer').classList.toggle('collapsed', !open);
}

// Called once at startup from Program.cs (OnNavigationCompleted) and whenever the Options
// dialog's "Show Tab Bar" checkbox changes -- default on, see AppSettings.ShowTabBar. Unlike
// the drawer, there's no user-facing toggle/shortcut for this beyond the checkbox itself.
function setTabBarVisible(visible) {
    document.getElementById('tab-bar').classList.toggle('tabbar-hidden', !visible);
}

function toggleDrawer() {
    setDrawerOpen(!_drawerOpen);
    window.chrome.webview.postMessage({ type: 'drawer_toggled', open: _drawerOpen });
}

// --- Drawer resizing ---
var DRAWER_MIN_WIDTH = 160;
var DRAWER_MAX_WIDTH = 500;

// Called once at startup from Program.cs (OnNavigationCompleted) with the saved width, mirroring
// setDrawerOpen() above. Also called live while dragging, below.
function setDrawerWidth(px) {
    px = Math.min(DRAWER_MAX_WIDTH, Math.max(DRAWER_MIN_WIDTH, px));
    document.documentElement.style.setProperty('--drawer-width', px + 'px');
    return px;
}

(function() {
    var resizer = document.getElementById('drawer-resizer');
    var drawer = document.getElementById('drawer');
    var dragging = false;
    var lastWidth = 0;

    resizer.addEventListener('mousedown', function(e) {
        dragging = true;
        lastWidth = drawer.getBoundingClientRect().width;
        resizer.classList.add('dragging');
        drawer.classList.add('no-transition');
        e.preventDefault();   // avoid text selection elsewhere in the window while dragging
    });

    document.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        // The resizer sits right at the drawer's right edge, so the cursor's x position IS the
        // target drawer width (drawer starts at x=0).
        lastWidth = setDrawerWidth(e.clientX);
    });

    document.addEventListener('mouseup', function() {
        if (!dragging) return;
        dragging = false;
        resizer.classList.remove('dragging');
        drawer.classList.remove('no-transition');
        // Persisted once, on release, rather than on every mousemove -- same reasoning as the
        // debounced scroll-position save elsewhere in this file, just via a discrete event
        // instead of a timer.
        window.chrome.webview.postMessage({ type: 'drawer_width', width: Math.round(lastWidth) });
    });
})();

// --- Tabs ---
var _tabDirs = {};       // tab id -> the folder its file lives in, so relative links can be resolved against it
var _activeTabDir = null;
var _activeTabId = null;
var _scrollPositions = {};  // tab id -> #content-area.scrollTop, captured on switch-away (activateTab below)

function addTab(info, activate) {
    // info: { id, name, path, scrollTop }. scrollTop is the position persisted from a previous
    // session (Program.cs looks it up by file path in settings.ScrollPositions) -- seeding the
    // in-session map with it here means render()'s existing _scrollPositions[_activeTabId]
    // lookup (see render() above) picks it up automatically on first render, no separate
    // restore path needed.
    //
    // activate (default true) controls whether this call also switches to the new tab via
    // activateTab() below. Program.cs passes false when restoring a whole saved session, since
    // that adds every tab in a loop before any of them are actually rendered -- if each one
    // triggered activateTab()'s "save the outgoing tab's scroll position" logic, it would read
    // #content-area's still-empty scrollTop (0) and clobber the very positions we just seeded
    // above, for every tab except whichever is restored last. RestoreSession instead adds all
    // tabs inactive, then explicitly activates just the one that should end up on top.
    if (activate === undefined) activate = true;
    _tabDirs[info.id] = info.path || '';
    _scrollPositions[info.id] = info.scrollTop || 0;
    // Add to tab bar
    var tabBar = document.getElementById('tab-bar');
    var tab = document.createElement('div');
    tab.className = 'tab';
    tab.dataset.id = info.id;
    tab.innerHTML = '<span class="tab-name">' + _esc(info.name) + '</span><span class="tab-close">&times;</span>';
    tab.querySelector('.tab-name').addEventListener('click', function() {
        window.chrome.webview.postMessage({ type: 'switch_tab', id: info.id });
    });
    tab.querySelector('.tab-close').addEventListener('click', function(e) {
        e.stopPropagation();
        window.chrome.webview.postMessage({ type: 'close_tab', id: info.id });
    });
    tabBar.appendChild(tab);

    // Add to drawer
    var drawerList = document.getElementById('drawer-list');
    var item = document.createElement('div');
    item.className = 'drawer-item';
    item.dataset.id = info.id;
    // _esc()'d values go straight into a title="..." attribute below, unescaped for that
    // context -- safe only because it's not general-purpose text: info.name/info.path are
    // real Windows file/folder names, and Windows disallows a literal '"' in those, so there's
    // nothing here that could break out of the attribute.
    item.innerHTML =
        '<div class="drawer-info">' +
            '<span class="drawer-filename" title="' + _esc(info.name) + '">' + _esc(info.name) + '</span>' +
            '<span class="drawer-path" title="' + _esc(info.path || '') + '">' + _esc(info.path || '') + '</span>' +
        '</div>' +
        '<span class="drawer-close">&times;</span>';
    item.querySelector('.drawer-info').addEventListener('click', function() {
        window.chrome.webview.postMessage({ type: 'switch_tab', id: info.id });
    });
    item.querySelector('.drawer-close').addEventListener('click', function(e) {
        e.stopPropagation();
        window.chrome.webview.postMessage({ type: 'close_tab', id: info.id });
    });
    drawerList.appendChild(item);

    // Activate this tab
    if (activate) activateTab(info.id);
}

function activateTab(id) {
    // Cancel any pending debounced save left over from the tab we're leaving. If that timer
    // fired AFTER _activeTabId below has switched to the NEW tab but BEFORE the new tab's
    // content has actually been rendered (render() is a separate, later ExecuteScriptAsync
    // call from Program.cs -- not synchronous with this one), it would read the OLD tab's
    // still-displayed scrollTop and save it under the NEW tab's id/file path -- corrupting the
    // new tab's saved position with a value that belongs to a different, possibly much longer,
    // document. That corrupted value then reproduces on every future open of that file, restart
    // included, since it's now what's on disk.
    //
    // Persisting the outgoing tab's position directly here, rather than leaving it to the
    // timer, closes that race -- and also means a scroll immediately followed by a switch never
    // loses its save the way relying purely on the 600ms debounce would.
    if (_scrollSaveTimer) { clearTimeout(_scrollSaveTimer); _scrollSaveTimer = null; }
    if (_activeTabId && _activeTabId in _tabDirs) {
        _persistScrollPosition(_activeTabId, document.getElementById('content-area').scrollTop);
    }
    _activeTabId = id;
    _activeTabDir = _tabDirs[id] || null;
    // Tab bar
    document.querySelectorAll('#tab-bar .tab').forEach(function(t) {
        t.classList.toggle('active', t.dataset.id === id);
    });
    // Drawer
    document.querySelectorAll('#drawer-list .drawer-item').forEach(function(d) {
        d.classList.toggle('active', d.dataset.id === id);
    });
}

function removeTab(id) {
    delete _tabDirs[id];
    delete _scrollPositions[id];
    var tab = document.querySelector('#tab-bar .tab[data-id="' + id + '"]');
    if (tab) tab.remove();
    var item = document.querySelector('#drawer-list .drawer-item[data-id="' + id + '"]');
    if (item) item.remove();
}

// Persists a tab's scroll position to disk (via Program.cs -> settings.ScrollPositions, keyed
// by file path) so it survives closing and reopening PrettyReMark, not just switching tabs within
// a session -- and keeps the in-session cache in sync too. Shared by the debounced scroll
// listener below and render()/reloadContent()'s stale-scrollTop self-heal.
function _persistScrollPosition(id, scrollTop) {
    _scrollPositions[id] = scrollTop;
    window.chrome.webview.postMessage({ type: 'scroll_position', id: id, scrollTop: scrollTop });
}

// Debounced 600ms after scrolling stops, rather than on every scroll event, since a rapid
// scroll-fling would otherwise fire dozens of redundant saves for one motion.
var _scrollSaveTimer = null;
document.getElementById('content-area').addEventListener('scroll', function() {
    if (_scrollSaveTimer) clearTimeout(_scrollSaveTimer);
    _scrollSaveTimer = setTimeout(function() {
        if (!_activeTabId) return;
        _persistScrollPosition(_activeTabId, document.getElementById('content-area').scrollTop);
    }, 600);
}, { passive: true });

function _esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

// --- About ---
function showAbout() {
    var existing = document.getElementById('app-about');
    if (existing) { existing.remove(); return; }
    var o = document.createElement('div');
    o.id = 'app-about';
    o.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;justify-content:center;align-items:center;z-index:9999;';
    var bg = _dark ? '#161b22' : '#fff';
    var fg = _dark ? '#f0f6fc' : '#1f2328';
    var sub = _dark ? '#8b949e' : '#656d76';
    var link = _dark ? '#4493f8' : '#0969da';
    var btnBg = _dark ? '#21262d' : '#f6f8fa';
    var btnBorder = _dark ? '#30363d' : '#d1d9e0';
    o.innerHTML = '<div style="background:' + bg + ';border-radius:12px;overflow:hidden;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.3);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;max-width:480px;max-height:90vh;display:flex;flex-direction:column;position:relative;">'
        + '<button id="app-about-close" style="position:absolute;top:8px;right:8px;width:28px;height:28px;border:none;background:rgba(0,0,0,0.3);color:#fff;font-size:18px;line-height:1;border-radius:6px;cursor:pointer;z-index:1;">&times;</button>'
        + '<div style="background:' + (bg === '#fff' ? '#f6f8fa' : '#0d1117') + ';padding:24px;flex-shrink:0;"><img src="logo.png" alt="' + _esc(T('app_name')) + '" style="max-width:100%;max-height:40vh;display:block;margin:0 auto;"></div>'
        + '<div style="padding:20px 32px 28px;">'
        + '<h2 style="margin:0 0 4px 0;color:' + fg + ';">' + _esc(T('app_name')) + '</h2>'
        + (_version ? '<p style="margin:0 0 8px 0;color:' + sub + ';font-size:12px;">v' + _esc(_version) + '</p>' : '')
        + '<p style="margin:0 0 12px 0;color:' + sub + ';font-size:14px;">' + _esc(T('about_description')) + '</p>'
        + '<a href="https://gitlab.com/DerellLicht/pretty-mark" style="color:' + link + ';font-size:14px;">gitlab.com/DerellLicht/pretty-mark</a>'
        + '<br><br><button id="app-about-ok" style="padding:6px 20px;border:1px solid ' + btnBorder + ';border-radius:6px;background:' + btnBg + ';color:' + fg + ';cursor:pointer;font-size:14px;">OK</button>'
        + '</div></div>';
    var closeAbout = function() { o.remove(); document.removeEventListener('keydown', escHandler); };
    var escHandler = function(e) { if (e.key === 'Escape') closeAbout(); };
    o.addEventListener('click', function(e) { if (e.target === o) closeAbout(); });
    document.body.appendChild(o);
    document.getElementById('app-about-ok').addEventListener('click', closeAbout);
    document.getElementById('app-about-close').addEventListener('click', closeAbout);
    document.addEventListener('keydown', escHandler);
}

// External links — open in system browser. Local links (relative or file:///) — resolve
// against the CURRENT TAB'S OWN FOLDER and hand off to PrettyReMark's tab list or the OS default
// app. We must use the raw href attribute, not the browser-resolved a.href: the document's base
// URL is https://app.local/index.html (PrettyReMark's own virtual host), so a.href would resolve
// any relative link against app.local instead of the folder the file actually lives in.
document.addEventListener('click', function(e) {
    var a = e.target.closest('a[href]');
    if (!a) return;
    var raw = a.getAttribute('href');
    if (!raw || raw.charAt(0) === '#') return;   // in-page anchor — let the browser scroll to it natively
    if (/^mailto:|^tel:/i.test(raw)) return;     // let the OS handle these as usual

    e.preventDefault();

    if (/^https?:\/\//i.test(raw)) {
        window.chrome.webview.postMessage({ type: 'open_url', url: raw });
        return;
    }

    var target;
    if (/^file:\/\/\//i.test(raw)) {
        target = raw;
    } else if (_activeTabDir) {
        // The href may already be percent-encoded (e.g. split_convos.py writes %20 for spaces),
        // or it may be raw/unencoded (e.g. hand-written links with literal spaces). Decode first
        // so either style ends up normalized to real characters, then encode exactly once —
        // encoding an already-encoded string here would turn "%20" into "%2520" and break the path.
        var relPath = raw;
        try { relPath = decodeURIComponent(raw); } catch (ex) { /* not valid percent-encoding — use raw as written */ }
        target = 'file:///' + encodeURI(_activeTabDir.replace(/\\/g, '/') + '/' + relPath);
    } else {
        return; // no known folder to resolve a relative link against
    }
    window.chrome.webview.postMessage({ type: 'open_local_file', url: target });
});

// Close WinForms menu on click
document.addEventListener('mousedown', function() {
    window.chrome.webview.postMessage({ type: 'click' });
});

// --- Drag & drop ---
document.addEventListener('dragover', function(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
});

// --- Find bar (DOM-based highlighting) ---
var _findMatches = [];
var _findCurrent = -1;

function _clearFind() {
    _findMatches = [];
    _findCurrent = -1;
    document.getElementById('find-count').textContent = '';
    // Unwrap all <mark> elements
    _el.querySelectorAll('mark.find-match').forEach(function(m) {
        var parent = m.parentNode;
        parent.replaceChild(document.createTextNode(m.textContent), m);
        parent.normalize();
    });
}

function _highlightFind(query) {
    _clearFind();
    if (!query) return;
    var lowerQuery = query.toLowerCase();
    var walker = document.createTreeWalker(_el, NodeFilter.SHOW_TEXT, null);
    var textNodes = [];
    while (walker.nextNode()) textNodes.push(walker.currentNode);
    for (var i = 0; i < textNodes.length; i++) {
        var node = textNodes[i];
        var text = node.textContent;
        var lowerText = text.toLowerCase();
        var idx = lowerText.indexOf(lowerQuery);
        if (idx === -1) continue;
        var frag = document.createDocumentFragment();
        var lastIdx = 0;
        while (idx !== -1) {
            if (idx > lastIdx) frag.appendChild(document.createTextNode(text.substring(lastIdx, idx)));
            var mark = document.createElement('mark');
            mark.className = 'find-match';
            mark.textContent = text.substring(idx, idx + query.length);
            frag.appendChild(mark);
            _findMatches.push(mark);
            lastIdx = idx + query.length;
            idx = lowerText.indexOf(lowerQuery, lastIdx);
        }
        if (lastIdx < text.length) frag.appendChild(document.createTextNode(text.substring(lastIdx)));
        node.parentNode.replaceChild(frag, node);
    }
    if (_findMatches.length > 0) {
        _findCurrent = 0;
        _showCurrentMatch();
    }
    _updateFindCount();
}

function _showCurrentMatch() {
    _findMatches.forEach(function(m) { m.classList.remove('current'); });
    if (_findCurrent >= 0 && _findCurrent < _findMatches.length) {
        var m = _findMatches[_findCurrent];
        _revealMatch(m);
        m.classList.add('current');
        _scrollMatchIntoView(m);
    }
}

// A closed <details> (a supported markdown/HTML tag here, e.g. collapsible sections like
// split_convos.py's "Conversation Overview") renders none of its content -- no box, no
// position -- so a match inside one can't be scrolled to at all until it's opened. Walk up
// from the match and open any closed <details> ancestors first, the same way Chrome's own
// find-in-page auto-expands <details> to reveal a match. Left open afterward rather than
// re-collapsed, again matching native find behavior.
function _revealMatch(mark) {
    var el = mark.parentElement;
    while (el && el !== _el) {
        if (el.tagName === 'DETAILS' && !el.open) el.open = true;
        el = el.parentElement;
    }
}

// mark.scrollIntoView() looks correct but silently no-ops here: WebView2/Chromium's smooth-scroll
// path doesn't account for #content-area's CSS `zoom` scaling (see _updateZoom above) when
// computing the target offset, so it lands on ~0 scroll distance and the viewport never moves --
// even at zoom 1.0, since just having `zoom` set establishes the broken coordinate mapping.
// getBoundingClientRect() and #content-area's own scrollTop stay consistent under CSS zoom
// (unlike transform: scale), so computing the delta ourselves and calling scrollTo() on the
// container directly sidesteps scrollIntoView's internal calculation entirely.
function _scrollMatchIntoView(mark) {
    var container = document.getElementById('content-area');
    var containerRect = container.getBoundingClientRect();
    var markRect = mark.getBoundingClientRect();
    var delta = (markRect.top + markRect.height / 2) - (containerRect.top + containerRect.height / 2);
    container.scrollTo({ top: container.scrollTop + delta, behavior: 'smooth' });
}

function _updateFindCount() {
    var el = document.getElementById('find-count');
    if (_findMatches.length === 0) {
        el.textContent = document.getElementById('find-input').value ? T('find_no_results') : '';
    } else {
        el.textContent = (_findCurrent + 1) + '/' + _findMatches.length;
    }
}

function findNext() {
    if (_findMatches.length === 0) return;
    _findCurrent = (_findCurrent + 1) % _findMatches.length;
    _showCurrentMatch();
    _updateFindCount();
}

function findPrev() {
    if (_findMatches.length === 0) return;
    _findCurrent = (_findCurrent - 1 + _findMatches.length) % _findMatches.length;
    _showCurrentMatch();
    _updateFindCount();
}

function toggleFind() {
    var bar = document.getElementById('find-bar');
    if (bar.style.display === 'flex') {
        bar.style.display = 'none';
        _clearFind();
    } else {
        bar.style.display = 'flex';
        var input = document.getElementById('find-input');
        input.focus();
        input.select();
    }
}

document.getElementById('find-input').addEventListener('input', function() {
    _highlightFind(this.value);
});
document.getElementById('find-next').addEventListener('click', function() { findNext(); });
document.getElementById('find-prev').addEventListener('click', function() { findPrev(); });
document.getElementById('find-close').addEventListener('click', function() {
    document.getElementById('find-bar').style.display = 'none';
    _clearFind();
});
document.getElementById('find-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === 'F3') {
        e.preventDefault();
        if (e.shiftKey) findPrev(); else findNext();
    }
    if (e.key === 'Escape') {
        document.getElementById('find-bar').style.display = 'none';
        _clearFind();
    }
});

// --- Keyboard shortcuts ---
document.addEventListener('keydown', function(e) {
    // Skip if typing in find input
    if (e.target.id === 'find-input') return;
    if (e.ctrlKey && e.key === 'o') {
        e.preventDefault();
        window.chrome.webview.postMessage({ type: 'shortcut', action: 'open' });
    }
    else if (e.ctrlKey && e.key === 'w') {
        e.preventDefault();
        window.chrome.webview.postMessage({ type: 'shortcut', action: 'close_tab' });
    }
    else if (e.ctrlKey && e.key === 'f') {
        e.preventDefault();
        toggleFind();
    }
    else if (e.key === 'F3') {
        // Only meaningful once a search has actually been run; otherwise let it fall through
        // (e.g. to WebView2's own default handling) instead of eating the keypress for nothing.
        if (_findMatches.length > 0) {
            e.preventDefault();
            if (e.shiftKey) findPrev(); else findNext();
        }
    }
    else if (e.key === 'F11') {
        e.preventDefault();
        window.chrome.webview.postMessage({ type: 'shortcut', action: 'fullscreen' });
    }
    else if (e.ctrlKey && e.key === 'd') {
        e.preventDefault();
        window.chrome.webview.postMessage({ type: 'shortcut', action: 'dark_mode' });
    }
    else if (e.ctrlKey && e.key === 'b') {
        e.preventDefault();
        window.chrome.webview.postMessage({ type: 'shortcut', action: 'sidebar' });
    }
    else if (e.ctrlKey && e.key === 'p') {
        e.preventDefault();
        window.chrome.webview.postMessage({ type: 'shortcut', action: 'print' });
    }
    else if (e.ctrlKey && (e.key === '+' || e.key === '=')) {
        e.preventDefault();
        zoomIn();
    }
    else if (e.ctrlKey && e.key === '-') {
        e.preventDefault();
        zoomOut();
    }
    else if (e.ctrlKey && e.key === '0') {
        e.preventDefault();
        zoomReset();
    }
});
</script>
